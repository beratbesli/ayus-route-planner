[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ayus-route-planner"
version = "0.3.0"
description = "A.Y.U.S. image-based disaster route planning prototype"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "networkx>=3.2,<4.0",
  "numpy>=1.24,<3.0",
  "opencv-python>=4.8,<6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "ruff>=0.6,<1.0",
]
build = [
  "pyinstaller>=6.22.2,<7.0",
]

[project.scripts]
ayus = "ayus.cli:main"
ayus-gui = "ayus.gui:launch_gui"

[tool.setuptools.packages.find]
include = ["ayus*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
