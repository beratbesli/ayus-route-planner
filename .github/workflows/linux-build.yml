name: Linux application

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          mkdir -p ~/.local/bin
          curl -fsSL -o ~/.local/bin/appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x ~/.local/bin/appimagetool
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Build .deb and AppImage
        run: |
          ./paketle.sh
      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayus-debian-package
          path: dist/*.deb
      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayus-appimage
          path: dist/*.AppImage

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish Linux Assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" artifacts/ayus-debian-package/*.deb artifacts/ayus-appimage/*.AppImage --repo "$GITHUB_REPOSITORY" --clobber
